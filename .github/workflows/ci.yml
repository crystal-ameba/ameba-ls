name: Ameba LS

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        crystal: [latest, nightly]

    steps:
      - name: Set up Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: shards install

      - name: Run specs
        run: crystal spec --order random

      - name: Build Ameba LS binary
        run: shards build
